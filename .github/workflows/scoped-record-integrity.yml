name: Scheduler Scoped-Record Security
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  persisted-scope-boundary:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      # No model/network/scheduler effects; reads two isolated workspace fixtures.
      - run: node scripts/native-scoped-record-integrity.mjs